<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para mi niña bonita 💖</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      text-align: center;
      color: white;
    }

    h1 {
      margin-top: 40px;
      font-size: 2.5em;
    }

    .heart {
      position: relative;
      width: 120px;
      height: 120px;
      background: red;
      margin: 50px auto;
      transform: rotate(-45deg);
      animation: latido 1s infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 120px;
      height: 120px;
      background: red;
      border-radius: 50%;
    }

    .heart::before {
      top: -60px;
      left: 0;
    }

    .heart::after {
      left: 60px;
      top: 0;
    }

    @keyframes latido {
      0% { transform: scale(1) rotate(-45deg); }
      50% { transform: scale(1.2) rotate(-45deg); }
      100% { transform: scale(1) rotate(-45deg); }
    }

    .word {
      position: absolute;
      font-size: 20px;
      animation: flotar 10s linear infinite;
      opacity: 0.8;
    }

    @keyframes flotar {
      0% {
        transform: translateY(100vh);
        opacity: 0;
      }
      50% {
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <h1>Para mi niña bonita 💕</h1>

  <div class="heart"></div>

  <script>
    const palabras = [
      "Te amo 💖",
      "Te quiero 💕",
      "Eres hermosa 🌸",
      "Eres mi todo 🥺",
      "Mi amor ❤️",
      "Siempre tú 💫",
      "Mi felicidad 😍",
      "Mi princesa 👑",
      "Eres perfecta 💞",
      "Contigo todo 💘"
    ];

    function crearPalabra() {
      const palabra = document.createElement("div");
      palabra.className = "word";
      palabra.innerText = palabras[Math.floor(Math.random() * palabras.length)];

      palabra.style.left = Math.random() * 100 + "vw";
      palabra.style.fontSize = (Math.random() * 10 + 15) + "px";

      document.body.appendChild(palabra);

      setTimeout(() => {
        palabra.remove();
      }, 10000);
    }

    setInterval(crearPalabra, 500);
  </script>

</body>
</html>
